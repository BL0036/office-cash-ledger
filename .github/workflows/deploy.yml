# Builds the app and publishes it to GitHub Pages every time you push to `main`.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# See GITHUB-SETUP.md for the full walkthrough.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you also run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project sites live at https://<user>.github.io/<repo>/ so the app needs
      # that sub-path as its base. A repo named "<user>.github.io" is served
      # from the root instead.
      - name: Work out the base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "VITE_BASE=/" >> "$GITHUB_ENV" ;;
            *)           echo "VITE_BASE=/$REPO/" >> "$GITHUB_ENV" ;;
          esac

      # The Firebase values are NOT secrets (they end up in the public web
      # bundle anyway). Add them under Settings -> Secrets and variables ->
      # Actions -> Variables. Leave them out to build with Cloud Sync off.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
